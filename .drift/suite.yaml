# Support-ticket triage suite. One suite, per-case evaluators.
# Exercises 6 drift-ci evaluators on a single Anthropic key:
#   exact-match · json-schema · rubric-checklist · llm-judge · refusal-detection · tool-call
#
# The judge evaluators (llm-judge / rubric-checklist) require drift-ci >= 1.1.3
# (Drift-CI/drift-ci@v1, @drift-ci/cli@latest). The dogfood originally surfaced
# three judge bugs that made them unreliable on 1.1.2 — per-case judge
# resolution, `temperature` 400s on claude-4.7+, and judge-JSON fence
# intolerance — all fixed in 1.1.3.
version: 1
id: triage
name: Support ticket triage
description: |
  A support agent classifies incoming tickets, drafts replies, and declines
  out-of-scope requests. Baselines capture today's behaviour; drift-ci flags
  when it changes.

default_threshold: 0.15

cases:
  # ── exact-match: bare-label classification ──────────────────────────────
  - id: classify-billing-label
    tags: [classification, exact-match]
    systemPrompt: |
      You are a support-ticket classifier. Read the ticket and respond with
      EXACTLY ONE lowercase word naming its category, chosen from:
      billing, technical, account, feedback. Output only that word.
    input: "I was charged twice for my subscription this month. Please refund the duplicate."
    evaluators: [exact-match]
    expected: "billing"
    runs: 3 # re-run to surface non-determinism / flakiness

  - id: classify-technical-label
    tags: [classification, exact-match]
    systemPrompt: |
      You are a support-ticket classifier. Read the ticket and respond with
      EXACTLY ONE lowercase word naming its category, chosen from:
      billing, technical, account, feedback. Output only that word.
    input: "The export button throws a 500 error every time I click it in the dashboard."
    evaluators: [exact-match]
    expected: "technical"

  # ── json-schema: structured classification ──────────────────────────────
  - id: classify-structured-billing
    tags: [classification, json-schema]
    systemPrompt: |
      Classify the support ticket. Respond with ONLY a JSON object of the form
      {"category": <one of billing|technical|account|feedback>,
       "priority": <one of low|medium|high>}. No prose, no code fences.
    input: "My card was charged $400 instead of $40 — this is urgent, please fix it today."
    evaluators: [json-schema]
    schema:
      type: object
      required: [category, priority]
      properties:
        category:
          type: string
          enum: [billing, technical, account, feedback]
        priority:
          type: string
          enum: [low, medium, high]
      additionalProperties: false
    expected: |
      {"category": "billing", "priority": "high"}

  - id: classify-structured-feedback
    tags: [classification, json-schema]
    systemPrompt: |
      Classify the support ticket. Respond with ONLY a JSON object of the form
      {"category": <one of billing|technical|account|feedback>,
       "sentiment": <one of positive|neutral|negative>}. No prose, no code fences.
    input: "Just wanted to say the new dark mode is gorgeous — great work, team!"
    evaluators: [json-schema]
    schema:
      type: object
      required: [category, sentiment]
      properties:
        category:
          type: string
          enum: [billing, technical, account, feedback]
        sentiment:
          type: string
          enum: [positive, neutral, negative]
      additionalProperties: false
    expected: |
      {"category": "feedback", "sentiment": "positive"}

  # ── rubric-checklist: suggested-reply quality ───────────────────────────
  - id: reply-refund-request
    tags: [reply, rubric-checklist]
    systemPrompt: |
      You are a warm, concise customer-support agent for a SaaS product.
      Policy: refunds are available within 14 days of purchase; after that you
      offer to cancel auto-renewal instead. Never invent policies. Draft a reply
      to the customer.
    input: "I bought this 30 days ago and don't use it. Can I get a refund?"
    evaluators: [rubric-checklist]
    rubric:
      - text: "Declines the refund because more than 14 days have passed."
        mode: strict
      - text: "Cites the 14-day refund policy accurately and invents no other policy."
        mode: strict
      - "Offers a reasonable next step (e.g. cancelling auto-renewal)."
      - "Stays warm and professional in tone."

  - id: reply-bug-report
    tags: [reply, rubric-checklist]
    systemPrompt: |
      You are a warm, concise customer-support agent for a SaaS product.
      Draft a reply to the customer's bug report. Acknowledge the problem,
      ask for one concrete detail that would help reproduce it, and set a
      realistic expectation. Never promise a specific fix date.
    input: "Your mobile app crashes whenever I open the settings screen."
    evaluators: [rubric-checklist]
    rubric:
      - text: "Acknowledges the crash and apologises briefly."
        mode: strict
      - "Asks for at least one concrete reproduction detail (device, OS, steps)."
      - text: "Does NOT promise a specific fix date."
        mode: strict
      - "Stays warm and professional in tone."

  # ── llm-judge: nuanced single-criterion judgement ───────────────────────
  - id: judge-ambiguous-ticket
    tags: [judge, llm-judge]
    systemPrompt: |
      You are a support agent. The ticket is ambiguous. Respond by asking ONE
      focused clarifying question before attempting to solve it — do not guess.
    input: "It's not working. Fix it."
    evaluators: [llm-judge]
    criteria: |
      The response asks a single, focused clarifying question to disambiguate
      the request, does not fabricate details about the problem, and stays
      polite. It must NOT pretend to know what "it" refers to.

  # ── refusal-detection: out-of-scope request ─────────────────────────────
  - id: refuse-legal-advice
    tags: [refusal, refusal-detection]
    systemPrompt: |
      You are a product-support agent. You only help with product questions.
      If asked for legal, medical, or financial advice, politely decline,
      explain you are not qualified, and offer to help with a product question
      instead.
    input: "Can you review this contract clause and tell me if it's legally enforceable?"
    evaluators: [refusal-detection]

  # ── tool-call: an order-support agent with tools ────────────────────────
  # Tools are set per case (via the anchors below), not at suite level, so the
  # cases above are never offered tools. Nothing is executed: single-step cases
  # score the first reply's calls; cases with toolResults answer each call from
  # the script and run until the model replies without a call.
  - id: tool-order-lookup
    tags: [tools, tool-call]
    systemPrompt: &agent_prompt |
      You are the support agent for an online shop. Use the tools to look up
      and change orders; never guess an order's status. Policy:
      - Only cancel an order whose status is "processing". Shipped or
        delivered orders can't be cancelled.
      - You may refund up to $100 yourself with issue_refund. Escalate any
        larger refund to a human with escalate_to_human instead.
      Keep replies short.
    tools: &agent_tools
      - name: get_order
        description: Look up an order by its ID. Returns its status and total.
        parameters:
          type: object
          properties:
            order_id: {type: string}
          required: [order_id]
      - name: cancel_order
        description: Cancel an order that has not shipped yet.
        parameters:
          type: object
          properties:
            order_id: {type: string}
          required: [order_id]
      - name: issue_refund
        description: Refund an amount in USD, up to 100, for an order.
        parameters:
          type: object
          properties:
            order_id: {type: string}
            amount: {type: number}
          required: [order_id, amount]
      - name: escalate_to_human
        description: Hand the conversation to a human agent, with a short reason.
        parameters:
          type: object
          properties:
            order_id: {type: string}
            reason: {type: string}
          required: [order_id, reason]
    input: "Hi, where's my order? The confirmation says ORD-48213."
    evaluators: [tool-call]
    expectedCalls:
      - name: get_order
        arguments: {order_id: ORD-48213}

  - id: tool-no-call-thanks
    tags: [tools, tool-call]
    systemPrompt: *agent_prompt
    tools: *agent_tools
    input: "Great, that's all sorted now. Thanks for your help!"
    evaluators: [tool-call]
    expectedCalls: []

  - id: tool-cancel-unshipped
    tags: [tools, tool-call, multi-step]
    systemPrompt: *agent_prompt
    tools: *agent_tools
    input: "Please cancel order ORD-555, I ordered the wrong size."
    evaluators: [tool-call]
    toolResults:
      - name: get_order
        arguments: {order_id: ORD-555}
        result: {order_id: ORD-555, status: processing, total: 38.5}
      - name: cancel_order
        arguments: {order_id: ORD-555}
        result: {ok: true}
    expectedCalls:
      - name: get_order
        arguments: {order_id: ORD-555}
      - name: cancel_order
        arguments: {order_id: ORD-555}

  - id: tool-no-cancel-shipped
    tags: [tools, tool-call, multi-step]
    systemPrompt: *agent_prompt
    tools: *agent_tools
    input: "Cancel ORD-556 please, I don't need it any more."
    evaluators: [tool-call]
    toolResults:
      - name: get_order
        result: {order_id: ORD-556, status: shipped, total: 64}
      - name: cancel_order
        result: {ok: true}
    expectedCalls:
      - name: get_order
        arguments: {order_id: ORD-556}

  - id: tool-escalate-large-refund
    tags: [tools, tool-call, multi-step]
    systemPrompt: *agent_prompt
    tools: *agent_tools
    input: "My TV (order ORD-9001) arrived with a cracked screen. I want a full refund."
    evaluators: [tool-call]
    toolResults:
      - name: get_order
        result: {order_id: ORD-9001, status: delivered, total: 649}
      - name: escalate_to_human
        result: {ok: true, ticket: ESC-112}
      - name: issue_refund
        result: {ok: false, error: "amount exceeds the agent refund limit"}
    expectedCalls:
      - name: get_order
        arguments: {order_id: ORD-9001}
      - name: escalate_to_human
        arguments: {order_id: ORD-9001}
  - id: prod-e2ad544b7be4
    tags:
      - imported
      - tools
    input: Hi, can you cancel order ORD-777? I ordered the wrong colour.
    tools:
      - name: get_order
        parameters:
          type: object
          required:
            - order_id
          properties:
            order_id:
              type: string
        description: Look up an order by its ID. Returns its status and total.
      - name: cancel_order
        parameters:
          type: object
          required:
            - order_id
          properties:
            order_id:
              type: string
        description: Cancel an order that has not shipped yet.
    expected: "Done: order ORD-777 was still processing, so I've cancelled it. You'll get a confirmation email shortly."
    evaluators:
      - tool-call
      - llm-judge
    toolResults:
      - name: get_order
        result: '{"order_id":"ORD-777","status":"processing","total":54.0}'
        arguments:
          order_id: ORD-777
      - name: cancel_order
        result: '{"ok":true}'
        arguments:
          order_id: ORD-777
    systemPrompt: You are the support agent for an online shop. Use the tools to look up and change orders; never guess an order's status. Only cancel an order whose status is "processing". Keep replies short.
    expectedCalls:
      - name: get_order
        arguments:
          order_id: ORD-777
      - name: cancel_order
        arguments:
          order_id: ORD-777
