name: drift
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write   # keyless drift-ci.com sync via GitHub OIDC

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so origin/main is present for
                                  # baseline-source diffs + baseline-changed detection
      - uses: Drift-CI/drift-ci@29a7666813ab9c7647777c1caf4463e5db8c417f
        with:
          provider: anthropic
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          dashboard-url: https://drift-ci.com   # keyless: no dashboard-token needed
          # suite/config default to .drift/suite.yaml + .drift/config.yaml
          # baseline-source defaults to `branch` (the PR's committed baselines)
          # fail-on-regression + post-comment default to true
        env:
          # The action reads process.env.GITHUB_TOKEN to post the PR comment.
          # Without this the comment is silently skipped.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
